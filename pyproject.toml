[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "raapid-rag"
version = "1.0.0"
description = "Grounded GenAI micro-service for clinical-note and payer-policy Q&A (RAAPID Applied AI Engineer take-home)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=2.26,<3",
    "pydantic>=2.12,<3",
    "pydantic-settings>=2.13,<3",
    "python-dotenv>=1.2",
    "tenacity>=9.1",
    "sentence-transformers>=5.3",
    "numpy>=2.0",
    "rank-bm25>=0.2.2",
    "tiktoken>=0.12",
    "fastapi>=0.115",
    "uvicorn>=0.42",
    "typer>=0.24",
    "rich>=14",
    "streamlit>=1.55",
]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
raapid-rag = "raapid_rag.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
raapid_rag = ["llm/prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
markers = ["slow: loads the real sentence-transformers model (run with -m slow)"]
